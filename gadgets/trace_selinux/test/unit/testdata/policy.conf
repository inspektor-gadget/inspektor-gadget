# Minimal SELinux policy for TestTraceSelinuxDenial. It is meant to be loaded
# in a disposable test VM that has no policy, never on a real host.
#
# Compiled into policy.bin by the Makefile with "checkpolicy -U allow": every
# class and permission that is not declared here is allowed, so the only thing
# this policy can deny is reading a file labelled secret_t. The kernel starts
# in permissive mode after the first policy load
# (CONFIG_SECURITY_SELINUX_DEVELOP=y), so the read itself succeeds but the
# denial is still audited.
#
# Written from the following sources in the Linux tree:
# - scripts/selinux/mdp/mdp.c (v5.10): the kernel's generator of a dummy
#   policy, for the overall layout.
# - security/selinux/include/initial_sid_to_string.h (v5.10, v6.6, v6.18): the
#   initial SIDs, at the same positions in all three.
# - security/selinux/ss/policydb.c: policydb_read() (v5.10, v7.0) for the
#   class and permissions the kernel requires, policydb_load_isids() (v6.18)
#   for how initial SIDs are matched.

class process
class file

# The kernel matches the initial SIDs by position, not by name (see
# policydb_load_isids() in policydb.c), so all of them must be declared, in
# order. As in mdp.c, they are named after initial_sid_to_string.h, and
# unusedN where it has no name.
sid kernel
sid security
sid unlabeled
sid unused4
sid file
sid unused6
sid init
sid any_socket
sid port
sid netif
sid netmsg
sid node
sid unused13
sid unused14
sid unused15
sid unused16
sid unused17
sid unused18
sid unused19
sid unused20
sid unused21
sid unused22
sid unused23
sid unused24
sid unused25
sid unused26
sid devnull

# policydb_read() refuses a policy without the process class and these two
# permissions.
class process { transition dyntransition }
class file { read }

type test_t;
type secret_t;

role system_r;
role system_r types test_t;

allow test_t self:process { transition dyntransition };
allow test_t test_t:file read;

user system_u roles system_r;

sid kernel system_u:system_r:test_t
sid security system_u:system_r:test_t
sid unlabeled system_u:system_r:test_t
sid unused4 system_u:system_r:test_t
sid file system_u:system_r:test_t
sid unused6 system_u:system_r:test_t
sid init system_u:system_r:test_t
sid any_socket system_u:system_r:test_t
sid port system_u:system_r:test_t
sid netif system_u:system_r:test_t
sid netmsg system_u:system_r:test_t
sid node system_u:system_r:test_t
sid unused13 system_u:system_r:test_t
sid unused14 system_u:system_r:test_t
sid unused15 system_u:system_r:test_t
sid unused16 system_u:system_r:test_t
sid unused17 system_u:system_r:test_t
sid unused18 system_u:system_r:test_t
sid unused19 system_u:system_r:test_t
sid unused20 system_u:system_r:test_t
sid unused21 system_u:system_r:test_t
sid unused22 system_u:system_r:test_t
sid unused23 system_u:system_r:test_t
sid unused24 system_u:system_r:test_t
sid unused25 system_u:system_r:test_t
sid unused26 system_u:system_r:test_t
sid devnull system_u:system_r:test_t

# Make tmpfs labelable, so that the test can set security.selinux on a file.
fs_use_trans tmpfs system_u:object_r:test_t;
