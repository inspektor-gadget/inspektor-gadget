{{- if .Values.clientRole.create }}
# WARNING: pods/portforward towards the gadget namespace gives access to a
# privileged DaemonSet running on every node. Unless multi-tenancy is enabled,
# this is equivalent to node-level access. Bind with care.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gadget.fullname" . }}-client-role
  namespace: {{ include "gadget.namespace" . }}
  labels:
    {{- if not .Values.skipLabels }}
    {{- include "gadget.labels" . | nindent 4 }}
    {{- end }}
    k8s-app: {{ include "gadget.fullname" . }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    # Locate the gadget pod to talk to and validate --node.
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    # The gRPC connection to the gadget service is tunnelled over portforward.
    verbs: ["create"]
  {{- if and .Values.config.multiTenancy.enabled .Values.clientRole.tokenServiceAccounts }}
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames:
      {{- toYaml .Values.clientRole.tokenServiceAccounts | nindent 6 }}
    # Mint the audience-scoped token used by --auth-service-account.
    verbs: ["create"]
  {{- end }}
{{- end }}
